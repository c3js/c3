name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: yarn
      - run: yarn test
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7.8'
          bundler: '1.17.3'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: yarn
      - run: yarn build
      - run: yarn copy-to-docs
      - run: yarn build:docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: build
